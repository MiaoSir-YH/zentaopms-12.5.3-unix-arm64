name: Build ZenTaoPMS 12.5.3 Unix ARM64

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source:
    name: Source package
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Checkout zentaopms 12.5.3
        uses: actions/checkout@v4
        with:
          repository: easysoft/zentaopms
          ref: zentaopms_12.5.3_20210108
          path: zentaopms

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli unzip zip default-jre-headless make curl

      - name: Build source zip
        run: |
          sed -i 's/\r$//' scripts/build-source.sh
          chmod +x scripts/build-source.sh
          mkdir -p dist
          ZENTAOPMS_DIR="$GITHUB_WORKSPACE/zentaopms" OUTPUT_DIR="$GITHUB_WORKSPACE/dist" \
            bash scripts/build-source.sh

      - name: Upload source zip
        uses: actions/upload-artifact@v4
        with:
          name: ZenTaoPMS.12.5.3.zip
          path: dist/ZenTaoPMS.12.5.3.zip
          if-no-files-found: error

  zbox:
    name: ZBox ARM64 one-click
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    container:
      image: ubuntu:20.04
      options: --user root
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git curl wget xz-utils tar unzip zip file binutils \
            build-essential cmake bison pkg-config python3 \
            libssl-dev zlib1g-dev libxml2-dev libcurl4-openssl-dev \
            libjpeg-turbo8-dev libpng-dev libfreetype6-dev libzip-dev \
            libonig-dev libbz2-dev libpcre3-dev libexpat1-dev \
            libncurses5-dev libaio-dev libreadline-dev libpam0g-dev \
            patchelf php-cli default-jre-headless

      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Checkout zentaopms 12.5.3
        uses: actions/checkout@v4
        with:
          repository: easysoft/zentaopms
          ref: zentaopms_12.5.3_20210108
          path: zentaopms

      - name: Checkout zbox
        uses: actions/checkout@v4
        with:
          repository: easysoft/zbox
          path: zbox

      - name: Build zbox aarch64
        run: |
          sed -i 's/\r$//' scripts/*.sh
          chmod +x scripts/*.sh
          mkdir -p dist
          ZENTAOPMS_DIR="$GITHUB_WORKSPACE/zentaopms" \
          ZBOX_DIR="$GITHUB_WORKSPACE/zbox" \
          OUTPUT_DIR="$GITHUB_WORKSPACE/dist" \
            bash scripts/build-zbox-arm64.sh

      - name: Upload zbox tarball
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZenTaoPMS.12.5.3.zbox_arm64.tar.gz
          path: dist/ZenTaoPMS.12.5.3.zbox_arm64.tar.gz
          if-no-files-found: error

      - name: Smoke start
        run: |
          set -e
          /opt/zbox/run/php/php -v
          /opt/zbox/run/apache/httpd -v
          file /opt/zbox/run/apache/httpd | grep -E 'ARM aarch64|aarch64'
          file /opt/zbox/run/php/php | grep -E 'ARM aarch64|aarch64'
          /opt/zbox/zbox start || true
          sleep 3
          curl -fsSI http://127.0.0.1/zentao/install.php | head -n 20 || true
          curl -fsSI http://127.0.0.1/ | head -n 20 || true
          /opt/zbox/zbox stop || true
          ls -lh dist/
